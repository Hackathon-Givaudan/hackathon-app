name: hackathon

services:
  # « docker compose up » lance toute la tranche : app, ia et db.
  # Le dev container de VS Code y ajoute son service : .devcontainer/compose.yaml
  app:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      DATA_AI_URL: http://ia:8000
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:5173:5173
    depends_on:
      db:
        condition: service_healthy
      ia:
        condition: service_healthy

  ia:
    build: ia
    environment:
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_MODEL: ${AI_MODEL:-mistral:7b}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - 127.0.0.1:8000:8000
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10
