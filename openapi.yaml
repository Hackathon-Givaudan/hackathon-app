openapi: 3.1.0
info:
  title: Hackathon Givaudan, API du parcours client
  version: 0.1.0
  description: |
    Contrat entre le front (`web/`), l'API (`api/`) et le service Data/IA (`ia/`).
    Il décrit les quatre gestes du parcours d'une marque :
    envoyer ses envies, valider les notes, recevoir une formule, l'accepter.
    Un `brief` porte tout le parcours d'une marque, de ses envies à la formule acceptée.
    Autour de ces gestes : la fiche d'une matière, les précisions du brief,
    le retour après essai, et ce que lit le conseiller.
servers:
  - url: http://localhost:3000
    description: API locale, dans le dev container
# L'API du prototype n'a pas d'authentification
security: []
tags:
  - name: Parcours
    description: Les quatre gestes, dans l'ordre
  - name: Atelier
    description: Ce qui entoure les gestes, la fiche d'une matière, le brief complet, le retour
  - name: Conseiller
    description: Ce que lisent la marque dans son espace et le conseiller Givaudan
  - name: Santé
    description: État de l'API et de la base
paths:
  /api/health:
    get:
      tags: [Santé]
      operationId: getHealth
      summary: Vérifier que l'API et la base répondent
      responses:
        '200':
          description: L'API et PostgreSQL répondent
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status:
                    type: string
                    const: ok
                  db:
                    type: string
                    description: Version de PostgreSQL
  /api/session/turn:
    post:
      tags: [Parcours]
      operationId: sessionTurn
      summary: 'La séance : un échange avec Aurore'
      description: |
        La marque dit quelque chose, Aurore répond et dit ce qu'elle a entendu.
        L'API ne garde pas la séance : le front renvoie à chaque échange ce qui
        a déjà été entendu. Un `said` vide ouvre la séance. Quand `done` est vrai,
        Aurore a de quoi rédiger le brief, que le front crée par le geste 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [universe, said]
              properties:
                universe:
                  $ref: '#/components/schemas/Universe'
                said:
                  type: string
                  maxLength: 2000
                heard:
                  type: array
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/Idea'
      responses:
        '200':
          description: La réponse d'Aurore
          content:
            application/json:
              schema:
                type: object
                required: [reply, heard, done]
                properties:
                  reply:
                    type: string
                  heard:
                    type: array
                    items:
                      $ref: '#/components/schemas/Idea'
                  done:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/AiUnavailable'
  /api/briefs:
    get:
      tags: [Conseiller]
      operationId: listBriefs
      summary: Lister les briefs
      description: |
        Les cinquante briefs les plus récents, le plus récent d'abord.
        Le prototype n'a pas de comptes : la liste est la même pour la marque
        et pour le conseiller.
      responses:
        '200':
          description: Les briefs
          content:
            application/json:
              schema:
                type: object
                required: [briefs]
                properties:
                  briefs:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/Brief'
    post:
      tags: [Parcours]
      operationId: createBrief
      summary: 'Geste 1 : envoyer ses envies'
      description: |
        La marque décrit son projet avec ses mots : ambiance, usage, émotion.
        L'API crée un brief et propose des notes choisies dans le référentiel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BriefInput'
            example:
              universe: parfum
              wishes: Une brume minérale au lever du jour, fraîche et silencieuse.
      responses:
        '201':
          description: Brief créé, avec les notes proposées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/AiUnavailable'
  /api/briefs/{briefId}:
    get:
      tags: [Parcours]
      operationId: getBrief
      summary: Relire un brief et son état
      parameters:
        - $ref: '#/components/parameters/BriefId'
      responses:
        '200':
          description: Le brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/briefs/{briefId}/details:
    put:
      tags: [Atelier]
      operationId: completeBrief
      summary: Compléter le brief
      description: |
        Les précisions que la marque ajoute à son brief : budget, volume, cible,
        pays de vente… Toutes sont facultatives. La route remplace l'ensemble
        des précisions : un champ absent n'est pas renseigné. Elle reste ouverte
        à tout moment du parcours.
      parameters:
        - $ref: '#/components/parameters/BriefId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BriefDetails'
            example:
              budgetPerKg: 80
              target: grand_public
              salesCountries: [france, union_europeenne]
      responses:
        '200':
          description: Brief complété
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/briefs/{briefId}/potential:
    get:
      tags: [Conseiller]
      operationId: getPotential
      summary: Lire le potentiel d'un brief
      description: |
        Sept critères, chacun avec sa raison, et une suggestion pour le conseiller.
        Le service Data/IA les calcule à la demande, par des règles écrites et sans
        modèle, à partir des précisions du brief et de la formule proposée.
        Rien n'est enregistré : c'est le conseiller qui décide.
      parameters:
        - $ref: '#/components/parameters/BriefId'
      responses:
        '200':
          description: Le potentiel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Potential'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/AiUnavailable'
  /api/briefs/{briefId}/feedback:
    post:
      tags: [Atelier]
      operationId: giveFeedback
      summary: Donner son retour après l'essai
      description: |
        La marque a essayé son échantillon et dit ce qu'il faut ajuster.
        `parfait` ne se combine avec aucun autre ajustement.
        Renvoyer la route remplace le retour précédent.
      parameters:
        - $ref: '#/components/parameters/BriefId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adjustments]
              properties:
                adjustments:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Adjustment'
            example:
              adjustments: [plus_de_fraicheur]
      responses:
        '200':
          description: Retour enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/briefs/{briefId}/notes:
    put:
      tags: [Parcours]
      operationId: validateNotes
      summary: 'Geste 2 : valider les notes'
      description: |
        La marque garde les notes qui traduisent ses envies et retire les autres.
        Les identifiants doivent exister dans le référentiel.
      parameters:
        - $ref: '#/components/parameters/BriefId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [noteIds]
              properties:
                noteIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
            example:
              noteIds: [iris, cedre]
      responses:
        '200':
          description: Notes validées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/briefs/{briefId}/formula:
    post:
      tags: [Parcours]
      operationId: proposeFormula
      summary: 'Geste 3 : recevoir une formule'
      description: |
        L'API propose la formule de la banque la plus proche des notes validées,
        avec une explication. Rappeler la route renvoie la même formule.
      parameters:
        - $ref: '#/components/parameters/BriefId'
      responses:
        '200':
          description: Formule proposée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Formula'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/AiUnavailable'
  /api/briefs/{briefId}/formula/acceptance:
    post:
      tags: [Parcours]
      operationId: acceptFormula
      summary: 'Geste 4 : accepter la formule'
      description: La marque accepte la formule proposée. Le brief est alors terminé.
      parameters:
        - $ref: '#/components/parameters/BriefId'
      responses:
        '200':
          description: Formule acceptée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/materials/{noteId}:
    get:
      tags: [Atelier]
      operationId: getMaterial
      summary: Lire la fiche d'une matière
      description: |
        La fiche d'une note du plateau. Elle ne montre que ce qu'une source
        confirme : un champ absent n'est pas documenté.
      parameters:
        - name: noteId
          in: path
          required: true
          description: Identifiant de la note, celui de `Note.id`
          schema:
            type: string
            pattern: '^[a-z0-9-]{1,100}$'
          example: bergamote
      responses:
        '200':
          description: La fiche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '404':
          description: Cette note n'a pas de fiche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Cette note n'a pas encore de fiche
        '502':
          $ref: '#/components/responses/AiUnavailable'
components:
  parameters:
    BriefId:
      name: briefId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    Universe:
      type: string
      enum: [parfum, arome]
      description: Parfums et arômes alimentaires ont chacun leur référentiel
    BriefStatus:
      type: string
      enum:
        [notes_proposed, notes_validated, formula_proposed, formula_accepted]
      description: Où en est le parcours. Chaque geste fait avancer d'un état.
    Idea:
      type: object
      required: [kind, label, quote]
      description: Une idée retenue par Aurore pendant la séance
      properties:
        kind:
          type: string
          enum: [usage, ambiance, emotion, sensation]
        label:
          type: string
          maxLength: 100
          description: L'étiquette du référentiel, par exemple « bord de mer »
        quote:
          type: string
          maxLength: 200
          description: La phrase de la marque dont l'idée vient
    BriefInput:
      type: object
      required: [universe, wishes]
      properties:
        universe:
          $ref: '#/components/schemas/Universe'
        wishes:
          type: string
          minLength: 3
          maxLength: 2000
          description: Les envies de la marque, en texte libre
    Note:
      type: object
      required: [id, label, family]
      properties:
        id:
          type: string
          description: Identifiant dans le référentiel
        label:
          type: string
        family:
          type: string
          description: Famille de la note, par exemple boisée ou hespéridée
        reason:
          type: string
          description: Pourquoi cette note traduit les envies de la marque
    Brief:
      type: object
      required:
        [
          id,
          universe,
          wishes,
          status,
          proposedNotes,
          validatedNotes,
          details,
          createdAt,
        ]
      properties:
        id:
          type: integer
          minimum: 1
          example: 1
        universe:
          $ref: '#/components/schemas/Universe'
        wishes:
          type: string
        status:
          $ref: '#/components/schemas/BriefStatus'
        proposedNotes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        validatedNotes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        details:
          $ref: '#/components/schemas/BriefDetails'
        formulaName:
          type: string
          description: Nom de la formule proposée. Absent avant le geste 3.
        feedback:
          type: array
          description: Le retour après essai. Absent tant que la marque ne l'a pas donné.
          items:
            $ref: '#/components/schemas/Adjustment'
        createdAt:
          type: string
          format: date-time
    BriefDetails:
      type: object
      additionalProperties: false
      description: |
        Les précisions du brief, toutes facultatives. Les valeurs permises sont
        celles de `ia/data/modele_brief.json`, recopiées ici.
      properties:
        budgetPerKg:
          type: number
          minimum: 0
          description: Budget visé, en euros par kilo
        annualVolumeKg:
          type: number
          minimum: 0
          description: Volume annuel, en kilos
        projectType:
          type: string
          enum: [creation, reformulation, extension_gamme]
        target:
          type: string
          enum: [clientele_boutiques, grand_public, hotellerie]
        salesCountries:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [france, union_europeenne, royaume_uni, etats_unis, asie]
        positioning:
          type: string
          enum: [accessible, premium, luxe]
        objective:
          type: string
          enum: [se_differencier, fideliser, produit_signature]
        competition:
          type: string
          enum: [seulement_givaudan, autres_fournisseurs, pas_decide]
        relation:
          type: string
          enum: [direct, distributeur, ne_sait_pas]
        commitments:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [naturel, vegan, sans_allergenes, matieres_durables]
        constraints:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [delai_court, reglementation, cout_matieres]
    Adjustment:
      type: string
      enum: [plus_de_fraicheur, plus_de_tenue, plus_doux, parfait]
      description: Un ajustement demandé après l'essai, ou `parfait` s'il n'y en a aucun
    Material:
      type: object
      required: [noteId, name]
      description: La fiche d'une matière, telle que la Data l'a documentée
      properties:
        noteId:
          type: string
        name:
          type: string
        family:
          type: string
        tier:
          type: string
          description: Tête, Cœur ou Fond
        description:
          type: string
        material:
          type: string
          description: La matière première, par exemple « zeste de Citrus bergamia »
        origin:
          type: string
        obtained:
          type: string
          description: Le mode d'obtention
        hold:
          type: string
          description: La tenue
        pairsWith:
          type: array
          items:
            type: string
        vigilance:
          type: string
        sources:
          type: array
          items:
            type: string
            format: uri
    Potential:
      type: object
      required: [criteria, favorable, suggestion, suggestionLabel, note]
      description: Le potentiel d'un brief, une hypothèse que le conseiller valide
      properties:
        criteria:
          type: array
          items:
            type: object
            required: [id, label, status, reason]
            properties:
              id:
                type: string
              label:
                type: string
              status:
                type: string
                enum: [favorable, a_verifier, a_completer]
              reason:
                type: string
                description: La raison, tirée du brief. Une valeur inconnue s'écrit « [X] ».
        favorable:
          type: integer
          minimum: 0
          description: Nombre de critères favorables
        suggestion:
          type: string
          enum: [prioriser, orienter_banque, mettre_en_attente]
        suggestionLabel:
          type: string
        note:
          type: string
          description: Le rappel que la décision revient au conseiller
    Formula:
      type: object
      required: [id, name, notes, explanation, source]
      properties:
        id:
          type: string
          description: Identifiant dans la banque de formules
        name:
          type: string
        notes:
          type: array
          items:
            type: object
            required: [note, share]
            properties:
              note:
                $ref: '#/components/schemas/Note'
              share:
                type: integer
                minimum: 1
                maximum: 100
                description: Part de la note dans la formule, en pourcentage
        explanation:
          type: string
          description: Lien entre la formule et les notes validées, en une ou deux phrases
        source:
          type: string
          description: Origine de la formule, ou « exemple construit »
        nearby:
          type: array
          maxItems: 3
          description: |
            Jusqu'à trois références proches de la banque, la proposée en premier.
            Chacune dit les notes gardées par la marque qu'elle contient.
          items:
            type: object
            required: [id, name, family, shared, why]
            properties:
              id:
                type: string
              name:
                type: string
              family:
                type: string
              shared:
                type: array
                items:
                  type: string
              why:
                type: string
        versions:
          type: array
          maxItems: 2
          description: |
            Deux versions de la formule, plus fraîche et plus chaude, pour un parfum.
            Chacune met en avant deux notes, sans dosage. Vide pour un arôme.
            La règle est écrite dans `ia/data/deux_versions.md`.
          items:
            type: object
            required: [id, title, accent, why]
            properties:
              id:
                type: string
                enum: [A, B]
              title:
                type: string
              accent:
                type: array
                items:
                  type: string
              why:
                type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Message lisible, en français
  responses:
    BadRequest:
      description: Requête invalide, par exemple un champ manquant ou une note inconnue
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Envies manquantes
    NotFound:
      description: Brief introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Brief introuvable
    Conflict:
      description: Le geste arrive trop tôt ou trop tard dans le parcours
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Validez les notes avant de demander une formule
    AiUnavailable:
      description: Le service Data/IA ou le modèle ne répond pas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Service IA indisponible, réessayez
