openapi: 3.1.0
info:
  title: Hackathon Givaudan, API du parcours client
  version: 0.1.0
  description: |
    Contrat entre le front (`web/`), l'API (`api/`) et le service Data/IA (`ia/`).
    Il décrit les quatre gestes du parcours d'une marque :
    décrire son projet, confirmer ce que nous avons compris,
    recevoir jusqu'à trois pistes, en choisir une.
    Un `brief` porte tout le parcours d'une marque, de ses envies à la formule acceptée.
servers:
  - url: http://localhost:3000
    description: API locale, dans le dev container
# L'API du prototype n'a pas d'authentification
security: []
tags:
  - name: Parcours
    description: Les quatre gestes, dans l'ordre
  - name: Santé
    description: État de l'API et de la base
paths:
  /api/health:
    get:
      tags: [Santé]
      operationId: getHealth
      summary: Vérifier que l'API et la base répondent
      responses:
        '200':
          description: L'API et PostgreSQL répondent
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status:
                    type: string
                    const: ok
                  db:
                    type: string
                    description: Version de PostgreSQL
  /api/briefs:
    post:
      tags: [Parcours]
      operationId: createBrief
      summary: 'Geste 1 : envoyer ses envies'
      description: |
        La marque décrit son projet avec ses mots : ambiance, usage, émotion.
        L'API crée un brief, dit ce qu'elle a compris du projet (`understood`)
        et propose des notes choisies dans le référentiel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BriefInput'
            example:
              universe: parfum
              wishes: Une brume minérale au lever du jour, fraîche et silencieuse.
      responses:
        '201':
          description: Brief créé, avec les notes proposées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/AiUnavailable'
  /api/briefs/{briefId}:
    get:
      tags: [Parcours]
      operationId: getBrief
      summary: Relire un brief et son état
      parameters:
        - $ref: '#/components/parameters/BriefId'
      responses:
        '200':
          description: Le brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/briefs/{briefId}/notes:
    put:
      tags: [Parcours]
      operationId: validateNotes
      summary: 'Geste 2 : valider les notes'
      description: |
        La marque garde les notes qui traduisent ses envies et retire les autres.
        Les identifiants doivent être ceux de notes proposées au geste 1.
        Revalider reste permis tant qu'aucune piste n'est choisie : les pistes
        déjà proposées sont alors annulées, et le brief revient à `notes_validated`.
      parameters:
        - $ref: '#/components/parameters/BriefId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [noteIds]
              properties:
                noteIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
            example:
              noteIds: [iris, cedre]
      responses:
        '200':
          description: Notes validées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/briefs/{briefId}/formulas:
    post:
      tags: [Parcours]
      operationId: proposeFormulas
      summary: "Geste 3 : recevoir jusqu'à trois pistes"
      description: |
        L'API propose les formules de la banque les plus proches des notes validées,
        trois au plus, la plus proche d'abord, chacune avec son explication.
        La première piste est la référence qui contient le plus de notes validées.
        Une deuxième ou une troisième ne s'ajoute que si elle en contient au moins deux :
        mieux vaut une piste juste que trois pistes dont une éloignée.
        Rappeler la route renvoie les mêmes pistes. Pour ajuster, la marque
        revalide ses notes (geste 2), puis redemande ses pistes.
      parameters:
        - $ref: '#/components/parameters/BriefId'
      responses:
        '200':
          description: Pistes proposées
          content:
            application/json:
              schema:
                type: object
                required: [formulas]
                properties:
                  formulas:
                    type: array
                    minItems: 1
                    maxItems: 3
                    items:
                      $ref: '#/components/schemas/Formula'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/AiUnavailable'
  /api/briefs/{briefId}/formulas/{formulaId}/acceptance:
    post:
      tags: [Parcours]
      operationId: acceptFormula
      summary: 'Geste 4 : choisir une piste'
      description: |
        La marque choisit une des pistes proposées. Le brief est alors terminé.
        Rechoisir la même piste répond 200. Répond 404 si `formulaId` n'est pas
        une des pistes de ce brief, et 409 s'il n'y a pas encore de pistes
        ou si une autre piste est déjà choisie.
      parameters:
        - $ref: '#/components/parameters/BriefId'
        - name: formulaId
          in: path
          required: true
          description: Identifiant d'une des pistes proposées au geste 3
          schema:
            type: string
      responses:
        '200':
          description: Piste choisie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    BriefId:
      name: briefId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    Universe:
      type: string
      enum: [parfum, arome]
      description: Parfums et arômes alimentaires ont chacun leur référentiel
    BriefStatus:
      type: string
      enum:
        [notes_proposed, notes_validated, formula_proposed, formula_accepted]
      description: |
        Où en est le parcours. Les gestes 1 à 4 font avancer d'un état.
        Revalider ses notes (geste 2) ramène de `formula_proposed` à `notes_validated`.
    Understanding:
      type: object
      required: [kind, label]
      description: Une idée que le service a retenue du projet de la marque
      properties:
        kind:
          type: string
          enum: [usage, ambiance, emotion, sensation]
          description: |
            `usage` : le produit ou son emploi (bougie, yaourt).
            `ambiance` : le lieu ou le moment (bord de mer, goûter).
            `emotion` : ce que la création fait ressentir (évasion, réconfort).
            `sensation` : ce qu'on perçoit en bouche, pour un arôme (crémeux, acidulé).
            Une étiquette présente dans plusieurs colonnes du référentiel, comme
            « dessert », est rangée en `usage`.
        label:
          type: string
          description: L'étiquette du référentiel, par exemple « bord de mer »
    BriefInput:
      type: object
      required: [universe, wishes]
      properties:
        universe:
          $ref: '#/components/schemas/Universe'
        wishes:
          type: string
          minLength: 3
          maxLength: 2000
          description: Les envies de la marque, en texte libre
    Note:
      type: object
      required: [id, label, family]
      properties:
        id:
          type: string
          description: Identifiant dans le référentiel
        label:
          type: string
        family:
          type: string
          description: Famille de la note, par exemple boisée ou hespéridée
        reason:
          type: string
          description: Pourquoi cette note traduit les envies de la marque
    Brief:
      type: object
      required:
        [
          id,
          universe,
          wishes,
          status,
          understood,
          proposedNotes,
          validatedNotes,
          createdAt,
        ]
      properties:
        id:
          type: integer
          minimum: 1
          example: 1
        universe:
          $ref: '#/components/schemas/Universe'
        wishes:
          type: string
        status:
          $ref: '#/components/schemas/BriefStatus'
        understood:
          type: array
          description: |
            Ce que nous avons compris du projet, pour le récapitulatif.
            Vide si le service n'a retenu aucune étiquette.
          items:
            $ref: '#/components/schemas/Understanding'
        proposedNotes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        validatedNotes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        acceptedFormulaId:
          type: string
          description: |
            Identifiant de la piste choisie. Absent tant que le statut
            n'est pas `formula_accepted`.
        createdAt:
          type: string
          format: date-time
    Formula:
      type: object
      required: [id, name, notes, explanation, source]
      properties:
        id:
          type: string
          description: Identifiant dans la banque de formules
        name:
          type: string
        notes:
          type: array
          items:
            type: object
            required: [note, share]
            properties:
              note:
                $ref: '#/components/schemas/Note'
              share:
                type: integer
                minimum: 1
                maximum: 100
                description: Part de la note dans la formule, en pourcentage
        explanation:
          type: string
          description: |
            Pourquoi cette piste : son lien avec les notes validées et le projet,
            en une ou deux phrases
        source:
          type: string
          description: Origine de la formule, ou « exemple construit »
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Message lisible, en français
  responses:
    BadRequest:
      description: Requête invalide, par exemple un champ manquant ou une note inconnue
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Envies manquantes
    NotFound:
      description: Brief introuvable, ou piste qui n'est pas une de celles de ce brief
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Brief introuvable
    Conflict:
      description: Le geste arrive trop tôt ou trop tard dans le parcours
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Validez les notes avant de demander vos pistes
    AiUnavailable:
      description: Le service Data/IA ou le modèle ne répond pas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Service IA indisponible, réessayez
